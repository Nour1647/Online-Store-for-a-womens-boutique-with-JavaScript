<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Nour Store </title>
</head>
<body>
  <div class="nav">
      <h2>✨ Nour Store</h2>
      <div class="links-1" id="links-1">
          <a href="signup.html">sign up</a>
          <a href="login.html">login</a>
      </div>
      <div class="links-2" id="links-2" style="display:none; position:relative; display:flex; align-items:center; gap:15px;">
          <h2 style="font-size: 18px; display:inline;"></h2>

          <a href="Wishlist.html" style="color:#e11d48; text-decoration:none;"><i class="fa fa-heart" style="font-size:20px;" title="My Wishlist"></i></a>

          <div style="position:relative; display:inline-block;">
              <i class="fa fa-shopping-bag" id="cart-icon" style="font-size:22px; color:#be185d; cursor:pointer; margin:5px 0px;"></i>
              <span id="count" style="display:none; background:#e11d48; color:white; border-radius:50%; padding:2px 7px; font-size:12px; font-weight:bold; position:absolute; top:-5px; right:-8px;">0</span>
          </div>

          <div id="cart" style="display:none; position: absolute; background: white; top: 48px; width: 250px; text-align: center; right: 0; padding: 15px; border-radius: 16px; border: 1px solid #fbcfe8; box-shadow: 0 15px 35px rgba(131,24,67,0.15); z-index: 100;">
              <h2 style="font-size: 18px; color: #9d174d; border-bottom: 1px solid #fce7f3; padding-bottom: 8px; margin-bottom: 8px;">My Bag</h2>
              <div></div>
              <a href="Products.html" style="display:block; background:linear-gradient(135deg, #be185d, #e11d48); color:white; font-size:14px; margin:12px 0 0 0; padding:8px; border-radius:999px;">View Bag & Checkout</a>
          </div>

          <a href="#" id="logout">log out</a>
      </div>
  </div>

  <div class="store-layout">
      <aside class="filter-sidebar">
          <h3><i class="fa fa-sliders"></i> Filter & Search</h3>

          <div class="search-box" style="margin-bottom: 20px;">
              <label for="searchInput">Product Name</label>
              <div class="input-wrapper">
                  <i class="fa fa-search"></i>
                  <input type="text" id="searchInput" placeholder="Search by product name...">
              </div>
          </div>

          <div class="categories-box" style="margin-bottom: 20px;">
              <label style="display: block; font-size: 14px; font-weight: 500; color: #831843; margin-bottom: 10px;">Categories</label>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                  <button type="button" class="category-btn active" data-category="all" style="text-align: left; padding: 8px 12px; border: 1px solid #fbcfe8; border-radius: 8px; background: #be185d; color: #fff; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; transition: 0.3s;">All Products</button>
                  <button type="button" class="category-btn" data-category="Bags" style="text-align: left; padding: 8px 12px; border: 1px solid #fbcfe8; border-radius: 8px; background: #fff; color: #831843; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; transition: 0.3s;">Bags</button>
                  <button type="button" class="category-btn" data-category="Dresses" style="text-align: left; padding: 8px 12px; border: 1px solid #fbcfe8; border-radius: 8px; background: #fff; color: #831843; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; transition: 0.3s;">Dresses</button>
                  <button type="button" class="category-btn" data-category="Shoes" style="text-align: left; padding: 8px 12px; border: 1px solid #fbcfe8; border-radius: 8px; background: #fff; color: #831843; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; transition: 0.3s;">Shoes & Heels</button>
                  <button type="button" class="category-btn" data-category="Blazers" style="text-align: left; padding: 8px 12px; border: 1px solid #fbcfe8; border-radius: 8px; background: #fff; color: #831843; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 500; transition: 0.3s;">Blazers</button>
              </div>
          </div>

          <div class="contact-box" style="border-top: 1px solid #fce7f3; padding-top: 15px;">
              <label style="display: block; font-size: 14px; font-weight: 500; color: #831843; margin-bottom: 10px;">Need Help?</label>
              <button type="button" id="contact-btn" style="width: 100%; text-align: center; padding: 10px 12px; border: 1px solid #be185d; border-radius: 8px; background: #fdf2f8; color: #be185d; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 600; transition: 0.3s;">
                  <i class="fa fa-envelope-o" style="margin-left: 5px;"></i> Contact Us
              </button>
          </div>
      </aside>

      <div id="container"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
